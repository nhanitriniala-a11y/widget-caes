<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAES 2027</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --sky-50:#f3f9fe; --sky-100:#e3f1fc; --sky-200:#c4e2f8; --sky-300:#93cbf2; --sky-500:#3a96dc; --sky-600:#2c82c6; --sky-800:#14527f; --sky-900:#0d3b5e;
    --mint-100:#d4f1e8; --mint-400:#6fd1b5; --mint-700:#17674f;
    --rose-100:#fbdcdc; --rose-400:#ee9d9d; --rose-700:#8f3438;
    --text:#17293a; --muted:#587086; --line:#d6e7f5; --white:#fff;
    --radius:18px;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--sky-50); color:var(--text);
         font:15px/1.5 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif; }
  button { font:inherit; cursor:pointer; color:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--sky-800); outline-offset:2px; }

  /* ---------- Hero ---------- */
  .hero { background:var(--sky-200); padding:40px 20px 56px; text-align:center; border-bottom-left-radius:36px; border-bottom-right-radius:36px; }
  .hero h1 { margin:0; font-size:clamp(36px,6vw,58px); font-weight:800; letter-spacing:-1px; color:var(--sky-900); }
  .hero p { margin:6px 0 24px; font-size:18px; color:var(--sky-800); }
  .search { position:relative; max-width:560px; margin:0 auto; }
  .search input { width:100%; padding:15px 46px 15px 50px; border:2px solid transparent; border-radius:999px; background:var(--white);
                  font:inherit; font-size:16px; color:var(--text); box-shadow:0 6px 22px rgba(20,82,127,.14); }
  .search input:focus { border-color:var(--sky-500); outline:none; }
  .search svg { position:absolute; left:18px; top:50%; transform:translateY(-50%); width:20px; height:20px; stroke:var(--sky-600); fill:none; stroke-width:2.2; stroke-linecap:round; }
  .search .clear { position:absolute; right:12px; top:50%; transform:translateY(-50%); border:0; background:var(--sky-100); border-radius:50%; width:28px; height:28px; line-height:1; display:none; }
  .search.has .clear { display:block; }

  main { max-width:1120px; margin:-30px auto 0; padding:0 22px 60px; }
  .notice { margin:0 0 18px; padding:12px 16px; border-radius:12px; background:var(--rose-100); color:var(--rose-700); }

  /* ---------- Chiffres clés ---------- */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; }
  .stat { text-align:left; border:2px solid transparent; border-radius:var(--radius); padding:18px 20px; background:var(--white);
          box-shadow:0 4px 16px rgba(20,82,127,.08); transition:transform .15s, border-color .15s; }
  .stat:hover { transform:translateY(-2px); }
  .stat.active { border-color:var(--sky-800); }
  .stat .lab { display:block; font-weight:600; color:var(--muted); }
  .stat .num { display:block; font-size:46px; font-weight:800; line-height:1.1; margin-top:2px; }
  .stat .pct { display:block; font-size:13px; font-weight:600; opacity:.85; }
  .stat.atraiter { background:var(--sky-100); color:var(--sky-900); }
  .stat.traite   { background:var(--mint-100); color:var(--mint-700); }
  .stat.cloture  { background:var(--rose-100); color:var(--rose-700); }
  .stat.atraiter .lab, .stat.traite .lab, .stat.cloture .lab { color:inherit; }

  /* Barre de répartition globale */
  .global { margin:20px 0 6px; }
  .bar { display:flex; height:14px; border-radius:999px; overflow:hidden; background:var(--sky-100); }
  .bar span { display:block; height:100%; }
  .seg-a { background:var(--sky-300); } .seg-t { background:var(--mint-400); } .seg-c { background:var(--rose-400); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:8px; font-size:13px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }

  h2.sec { margin:34px 0 14px; font-size:20px; color:var(--sky-900); }

  /* ---------- Modules ---------- */
  .modules { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; }
  .module { text-align:left; min-height:230px; border:0; border-radius:24px; padding:26px; background:var(--sky-600); color:#fff;
            display:flex; flex-direction:column; gap:10px; box-shadow:0 10px 26px rgba(44,130,198,.28); transition:transform .15s, background .15s; }
  .module:hover { transform:translateY(-3px); background:var(--sky-800); }
  .module.active { background:var(--sky-900); }
  .module .title { font-size:23px; font-weight:800; line-height:1.2; }
  .module .total { font-size:44px; font-weight:800; line-height:1; margin-top:auto; }
  .module .total small { font-size:15px; font-weight:600; margin-left:6px; opacity:.9; }
  .module .bar { background:rgba(255,255,255,.28); height:10px; }
  .module .seg-a { background:#fff; } .module .seg-t { background:var(--mint-400); } .module .seg-c { background:var(--rose-400); }
  .pills { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { padding:3px 11px; border-radius:999px; font-size:13px; font-weight:700; background:var(--sky-100); color:var(--sky-900); }
  .pill.t { background:var(--mint-100); color:var(--mint-700); }
  .pill.c { background:var(--rose-100); color:var(--rose-700); }
  .module.autre { background:#7d96ab; box-shadow:none; min-height:170px; }
  .module.autre:hover, .module.autre.active { background:#4f6a80; }

  /* ---------- Liste ---------- */
  .panel { margin-top:34px; background:var(--white); border-radius:var(--radius); padding:22px; box-shadow:0 4px 16px rgba(20,82,127,.08); scroll-margin-top:12px; }
  .panel-head { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  .panel-head h2 { margin:0; font-size:22px; color:var(--sky-900); }
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .tools select, .btn { border:1px solid var(--line); background:var(--white); border-radius:10px; padding:7px 12px; font:inherit; color:var(--sky-900); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 6px; }
  .chip { border:1px solid var(--line); background:var(--sky-50); border-radius:999px; padding:6px 15px; font-weight:600; color:var(--sky-900); }
  .chip b { margin-left:6px; opacity:.8; }
  .chip.active { background:var(--sky-600); border-color:var(--sky-600); color:#fff; }
  .chip.t.active { background:var(--mint-400); border-color:var(--mint-400); color:var(--mint-700); }
  .chip.c.active { background:var(--rose-400); border-color:var(--rose-400); color:var(--rose-700); }
  .row { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between; padding:14px 4px; border-top:1px solid var(--line); }
  .cand { padding:16px 4px 18px; border-top:1px solid var(--line); }
  .cand-top { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between; }
  .fields { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px 16px; margin:14px 0 0; padding:14px 16px; background:var(--sky-50); border-radius:14px; }
  .fld { min-width:0; }
  .fld.wide { grid-column:span 2; }
  @media (max-width:560px) { .fld.wide { grid-column:auto; } }
  .fld dt { font-size:12px; font-weight:700; color:var(--sky-800); }
  .fld dd { margin:1px 0 0; overflow-wrap:anywhere; white-space:pre-wrap; }
  .fld dd.none { color:var(--muted); }
  .who { font-weight:700; font-size:16px; }
  .sub { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; margin-left:8px; padding:1px 9px; border-radius:999px; font-size:12px; font-weight:700; vertical-align:middle; }
  .tag.a { background:var(--sky-100); color:var(--sky-900); } .tag.t { background:var(--mint-100); color:var(--mint-700); } .tag.c { background:var(--rose-100); color:var(--rose-700); }
  .seg { display:inline-flex; background:var(--sky-50); border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px; }
  .seg button { border:0; background:transparent; border-radius:9px; padding:6px 13px; color:var(--muted); font-weight:600; }
  .seg button:hover:not(:disabled):not(.on) { background:var(--sky-100); }
  .seg button.on.a { background:var(--sky-300); color:var(--sky-900); }
  .seg button.on.t { background:var(--mint-400); color:var(--mint-700); }
  .seg button.on.c { background:var(--rose-400); color:var(--rose-700); }
  .seg button:disabled { opacity:.55; cursor:progress; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .justif { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--sky-50); border-radius:12px; padding:7px 13px; font-weight:600; color:var(--muted); }
  .justif:hover:not(:disabled) { background:var(--sky-100); }
  .justif .box { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border:2px solid var(--sky-500); border-radius:5px; background:var(--white); font-size:13px; line-height:1; color:#fff; }
  .justif.on { background:var(--mint-100); border-color:var(--mint-400); color:var(--mint-700); }
  .justif.on .box { background:var(--mint-700); border-color:var(--mint-700); }
  .justif:disabled { opacity:.55; cursor:progress; }
  .note { margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .note-label { font-weight:700; font-size:13px; color:var(--sky-900); margin-bottom:6px; }
  .note-input { width:100%; box-sizing:border-box; min-height:64px; resize:vertical; font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--white); color:inherit; }
  .note-input:focus { outline:2px solid var(--sky-500); outline-offset:1px; }
  .note-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px; }
  .note-info { font-size:12px; color:var(--muted); }
  .note-save { border:1px solid var(--sky-500); background:var(--sky-500); color:#fff; border-radius:10px; padding:6px 14px; font-weight:600; cursor:pointer; }
  .note-save:disabled { opacity:.45; cursor:default; }
  .empty { padding:34px; text-align:center; color:var(--muted); }
  .diag { margin-top:30px; color:var(--muted); font-size:13px; }
  .diag summary { cursor:pointer; }
  .diag h3 { margin:14px 0 0; font-size:14px; color:var(--sky-900); }
  .diag table { margin-top:8px; border-collapse:collapse; }
  .diag td, .diag th { padding:4px 14px 4px 0; text-align:left; }
  mark { background:#fff3b0; border-radius:3px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--sky-900); color:#fff; padding:9px 18px; border-radius:999px;
           opacity:0; transition:opacity .2s; pointer-events:none; z-index:10; }
  .toast.show { opacity:1; }
  @media (prefers-reduced-motion:reduce) { .stat,.module,.toast { transition:none; } .stat:hover,.module:hover { transform:none; } }
</style>
</head>
<body>
<header class="hero">
  <h1>CAES 2027</h1>
  <p>Suivi des demandes par type de saisine</p>
  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Rechercher un dossier, un nom, un type…" aria-label="Rechercher un dossier" autocomplete="off">
    <button class="clear" id="clearQ" aria-label="Effacer la recherche">×</button>
  </div>
</header>
<main>
  <div id="notice"></div>
  <section class="stats" id="stats" aria-label="Chiffres clés"></section>
  <div class="global" id="global"></div>
  <h2 class="sec">Types de saisine</h2>
  <section class="modules" id="modules" aria-label="Modules"></section>
  <div id="panel"></div>
  <details class="diag" id="diag"></details>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
  // Valeurs écrites dans la colonne Statut quand on change l'état d'un dossier
  var VALEURS = { a: 'non réglé', t: 'Réglé', c: 'clôturé' };

  var STATUTS = [
    { key:'a', label:'À traiter' },
    { key:'t', label:'Traité' },
    { key:'c', label:'Clôturé' }
  ];
  var MODULES = [
    { key:'handmed',  label:'CAES HANDICAP / MÉDICAL' },
    { key:'sport',    label:'CAES SHN' },
    { key:'mutation', label:'CAES MUTATION / CHARGE DE FAMILLE' },
    { key:'autre',    label:'Autres / non classées' }
  ];

  var rows = [];
  var mapping = null;
  var view = { type:null, statut:null, open:false };
  var sortMode = 'recent';
  var query = '';

  // Champs affichés pour chaque candidat (dans cet ordre)
  var FIELDS = [
    { name:'Bac',           title:'Bac' },
    { name:'Academie',      title:'Académie d\'origine' },
    { name:'Justificatifs', title:'Justificatifs reçus' },
    { name:'AvisMedecin',   title:'Avis médecin',                       wide:true },
    { name:'Formation',     title:'Formation demandée par le candidat', wide:true },
    { name:'Proposition',   title:'Proposition faite par la CAES',      wide:true },
    { name:'Situation',     title:'Situation finale',                   wide:true }
  ];
  var IDENT = ['Numero', 'Nom', 'Prenom'];

  var COLS = [
    { name:'Statut', title:'Statut (Commentaire : Réglé / non réglé / clôturé)', type:'Any' },
    { name:'Type',   title:'Type de saisine', type:'Any' },
    { name:'Numero', title:'Numéro de dossier', type:'Any', optional:true },
    { name:'Nom',    title:'Nom du candidat', type:'Any', optional:true },
    { name:'Prenom', title:'Prénom du candidat', type:'Any', optional:true }
  ];
  COLS.push({ name:'AvisMedecin', title:'Avis du médecin (colonne Texte, protégeable par les droits d’accès Grist)', type:'Text', optional:true });
  FIELDS.forEach(function (f) { COLS.push({ name:f.name, title:f.title, type:'Any', optional:true }); });
  grist.ready({ requiredAccess:'full', columns:COLS });

  // Cases « Justificatif » : mémorisées dans les réglages du widget (pas dans le tableau)
  var justifs = {};
  var notes = {};     // « avis_12 » -> { t:texte, d:date ISO } : une clé par dossier, donc pas d'écrasement entre utilisateurs
  var drafts = {};    // texte en cours de saisie, non encore enregistré
  var renderLater = false;

  // Zones de saisie par dossier (ajouter une ligne pour un autre champ, ex. « Commentaire »)
  // Libellés propres au module CAES SHN (le reste des modules garde « Avis médecin »)
  var SHN_AVIS_TITLE = 'Expertise de la maison de la performance';
  var SHN_AVIS_PLACEHOLDER = 'Saisir l’expertise de la maison de la performance…';

  var NOTES = [
    { key:'avis', title:'Avis du médecin', placeholder:'Saisir l’avis du médecin…' }
  ];

  grist.onOptions(function (opts) {
    opts = opts || {};
    justifs = opts.justifs || {};
    notes = {};
    Object.keys(opts).forEach(function (k) {
      if (opts[k] && typeof opts[k] === 'object' && k.indexOf('avis_') === 0) notes[k] = opts[k];
    });
    render();
  });
  function isJustif(id) { return !!justifs[id]; }
  function typing() {
    var a = document.activeElement;
    return !!(a && a.classList && a.classList.contains('note-input'));
  }
  document.addEventListener('focusout', function () {
    setTimeout(function () { if (renderLater && !typing()) { renderLater = false; render(); } }, 0);
  });

  function saveNote(nkey, text, btn, info, rowId) {
    btn.disabled = true;
    if (nkey.indexOf('avis_') === 0 && mapping && mapping.AvisMedecin) {
      // Colonne du tableau : les droits d'accès Grist s'appliquent
      var fields = {};
      fields[mapping.AvisMedecin] = text;
      grist.selectedTable.update({ id:rowId, fields:fields }).then(function () {
        delete drafts[nkey];
        toast('Avis enregistré');
        renderLater = false;
        render();
      }).catch(function (e) {
        btn.disabled = false;
        toast('Enregistrement refusé (droits insuffisants ?) : ' + e.message);
      });
      return;
    }
    var val = { t:text, d:new Date().toISOString() };
    Promise.resolve(grist.setOption(nkey, val)).then(function () {
      notes[nkey] = val;
      delete drafts[nkey];
      toast('Enregistré');
      renderLater = false;
      render();
    }).catch(function (e) {
      btn.disabled = false;
      toast('Échec de l’enregistrement : ' + e.message);
    });
  }

  /* ---------- Utilitaires ---------- */
  function norm(v) {
    if (Array.isArray(v)) v = v.filter(function (x) { return x !== 'L'; }).join(' ');
    return String(v == null ? '' : v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  }
  function txt(v) {
    if (Array.isArray(v)) v = v.filter(function (x) { return x !== 'L'; }).join(', ');
    if (typeof v === 'number' && v > 946684800 && v < 4102444800 && v % 86400 === 0) {
      var d = new Date(v * 1000);   // colonne Date de Grist
      return ('0' + d.getUTCDate()).slice(-2) + '/' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '/' + d.getUTCFullYear();
    }
    return v == null ? '' : String(v);
  }
  // Règle de lecture de la colonne Commentaire :
  //   contient « clôturé »            -> Clôturé
  //   « non réglé » ou vide / autre   -> À traiter
  //   contient « réglé » ou « traité » -> Traité
  function statutOf(v) {
    var n = norm(v);
    if (n.indexOf('clotur') !== -1) return 'c';
    if (n.indexOf('non regl') !== -1 || n.indexOf('non traite') !== -1) return 'a';
    if (n.indexOf('regl') !== -1 || n.indexOf('traite') !== -1) return 't';
    return 'a';
  }
  function typeOf(v) {
    var n = norm(v);
    if (n.indexOf('handicap') !== -1 || n.indexOf('medic') !== -1) return 'handmed';
    if (n.indexOf('sportif') !== -1 || n.indexOf('haut niveau') !== -1 || n === 'shn') return 'sport';
    if (n.indexOf('mutation') !== -1 || n.indexOf('famille') !== -1 || n.indexOf('charge') !== -1) return 'mutation';
    return 'autre';
  }
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function count(list, key) { return list.filter(function (r) { return r.statut === key; }).length; }
  function pct(n, total) { return total ? Math.round(n * 100 / total) : 0; }
  function moduleLabel(key) { return MODULES.filter(function (m) { return m.key === key; })[0].label; }
  function statutLabel(key) { return STATUTS.filter(function (s) { return s.key === key; })[0].label; }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function bar(list) {
    var b = h('div', 'bar');
    ['a','t','c'].forEach(function (k) {
      var s = h('span', 'seg-' + k);
      s.style.width = pct(count(list, k), list.length) + '%';
      b.appendChild(s);
    });
    return b;
  }

  /* ---------- Données ---------- */
  var loadToken = 0;
  var ALL = ['Numero', 'Nom', 'Prenom'].concat(FIELDS.map(function (f) { return f.name; }));

  function build(id, get) {
    var st = get('Statut'), ty = get('Type');
    var r = { id:id, raw:txt(st), rawType:txt(ty), rawKind:typeof st, statut:statutOf(st), type:typeOf(ty), f:{} };
    ALL.forEach(function (k) { r.f[k] = txt(get(k)); });
    r.avisMed = get('AvisMedecin') == null ? '' : String(get('AvisMedecin'));
    return r;
  }
  function fullName(r) { return (r.f.Nom + ' ' + r.f.Prenom).trim(); }
  function candTitle(r) { return fullName(r) || ('Dossier n° ' + (r.f.Numero || r.id)); }

  // On lit la table complète : les filtres de la vue Grist ne cachent plus aucune ligne.
  grist.onRecords(function (recs, map) {
    mapping = map;
    if (!map) { rows = []; render(); return; }
    var token = ++loadToken;
    grist.selectedTable.getTableId().then(function (tid) {
      return grist.docApi.fetchTable(tid);
    }).then(function (t) {
      if (token !== loadToken) return;
      rows = t.id.map(function (id, i) {
        return build(id, function (k) { return map[k] && t[map[k]] ? t[map[k]][i] : ''; });
      });
      render();
    }).catch(function () {
      if (token !== loadToken) return;
      rows = recs.map(function (r) { return build(r.id, function (k) { return r[k]; }); });
      render();
    });
  });

  function setStatut(id, key, btns) {
    var fields = {};
    fields[mapping.Statut] = VALEURS[key];
    btns.forEach(function (b) { b.disabled = true; });
    grist.selectedTable.update({ id:id, fields:fields }).then(function () {
      toast('Dossier mis à jour : ' + statutLabel(key));
    }).catch(function (e) {
      btns.forEach(function (b) { b.disabled = false; });
      toast('Échec de la mise à jour : ' + e.message);
    });
  }

  function setJustif(id, value, btn) {
    var next = {};
    Object.keys(justifs).forEach(function (k) { next[k] = justifs[k]; });
    if (value) next[id] = true; else delete next[id];
    btn.disabled = true;
    Promise.resolve(grist.setOption('justifs', next)).then(function () {
      justifs = next;
      toast(value ? 'Justificatif coché' : 'Justificatif décoché');
      renderPanel();
    }).catch(function (e) {
      btn.disabled = false;
      toast('Échec de la mise à jour : ' + e.message);
    });
  }

  /* ---------- Recherche ---------- */
  var qInput = document.getElementById('q');
  var box = document.getElementById('searchBox');
  qInput.addEventListener('input', function () {
    query = qInput.value.trim();
    box.classList.toggle('has', !!qInput.value);
    if (query) view.open = true;
    renderPanel();
    renderStatsActive();
  });
  document.getElementById('clearQ').addEventListener('click', function () {
    qInput.value = ''; query = ''; box.classList.remove('has'); qInput.focus(); render();
  });

  /* ---------- Rendu ---------- */
  function render() {
    if (typing()) { renderLater = true; return; }
    var notice = document.getElementById('notice');
    notice.innerHTML = '';
    if (!mapping) {
      notice.appendChild(h('div', 'notice', 'Dans Grist, associez les colonnes dans le panneau de droite : Statut, Type de saisine, et si vous le souhaitez le nom du dossier.'));
    }
    renderStats();
    renderModules();
    renderPanel();
    renderDiag();
  }

  function renderStatsActive() {
    var cards = document.querySelectorAll('#stats .stat');
    Array.prototype.forEach.call(cards, function (c) {
      var k = c.getAttribute('data-k');
      var on = view.open && !view.type && ((k === 'all' && !view.statut) || k === view.statut);
      c.classList.toggle('active', !!on);
    });
  }

  function renderStats() {
    var s = document.getElementById('stats');
    s.innerHTML = '';
    var defs = [
      { k:'all', cls:'',        label:'Demandes',            n:rows.length },
      { k:'a',   cls:'atraiter', label:'Demandes à traiter',  n:count(rows,'a') },
      { k:'t',   cls:'traite',   label:'Demandes traitées',   n:count(rows,'t') },
      { k:'c',   cls:'cloture',  label:'Demandes clôturées',  n:count(rows,'c') }
    ];
    defs.forEach(function (d) {
      var b = h('button', 'stat ' + d.cls);
      b.setAttribute('data-k', d.k);
      b.appendChild(h('span', 'lab', d.label));
      b.appendChild(h('span', 'num', String(d.n)));
      b.appendChild(h('span', 'pct', d.k === 'all' ? 'Toutes les saisines' : pct(d.n, rows.length) + ' % du total'));
      b.addEventListener('click', function () {
        view = { type:null, statut: d.k === 'all' ? null : d.k, open:true };
        render(); scrollToPanel();
      });
      s.appendChild(b);
    });
    renderStatsActive();

    var g = document.getElementById('global');
    g.innerHTML = '';
    g.appendChild(bar(rows));
    var lg = h('div', 'legend');
    [['a','sky-300','À traiter'],['t','mint-400','Traitées'],['c','rose-400','Clôturées']].forEach(function (x) {
      var item = h('span');
      var dot = h('i'); dot.style.background = 'var(--' + x[1] + ')';
      item.appendChild(dot);
      item.appendChild(document.createTextNode(x[2] + ' : ' + count(rows, x[0])));
      lg.appendChild(item);
    });
    g.appendChild(lg);
  }

  function renderModules() {
    var m = document.getElementById('modules');
    m.innerHTML = '';
    MODULES.forEach(function (mod) {
      var inMod = rows.filter(function (r) { return r.type === mod.key; });
      if (mod.key === 'autre' && !inMod.length) return;
      var b = h('button', 'module ' + (mod.key === 'autre' ? 'autre' : '') + (view.type === mod.key && view.open ? ' active' : ''));
      b.appendChild(h('span', 'title', mod.label));
      var tot = h('span', 'total', String(inMod.length));
      tot.appendChild(h('small', null, 'demande' + (inMod.length > 1 ? 's' : '')));
      b.appendChild(tot);
      b.appendChild(bar(inMod));
      var pills = h('span', 'pills');
      STATUTS.forEach(function (s) {
        pills.appendChild(h('span', 'pill ' + s.key, count(inMod, s.key) + ' ' + s.label.toLowerCase()));
      });
      b.appendChild(pills);
      b.addEventListener('click', function () {
        view = { type:mod.key, statut:null, open:true };
        render(); scrollToPanel();
      });
      m.appendChild(b);
    });
  }

  function diagTable(d, title, rawKey, labelFn) {
    d.appendChild(h('h3', null, title));
    var seen = {};
    rows.forEach(function (r) {
      var k = r[rawKey] === '' ? '(vide)' : r[rawKey];
      if (!seen[k]) seen[k] = { n:0, lab:labelFn(r) };
      seen[k].n++;
    });
    var tb = h('table');
    var th = h('tr');
    ['Valeur lue dans Grist', 'Lignes', 'Compté comme'].forEach(function (x) { th.appendChild(h('th', null, x)); });
    tb.appendChild(th);
    Object.keys(seen).sort().slice(0, 40).forEach(function (k) {
      var tr = h('tr');
      tr.appendChild(h('td', null, k));
      tr.appendChild(h('td', null, String(seen[k].n)));
      tr.appendChild(h('td', null, seen[k].lab));
      tb.appendChild(tr);
    });
    d.appendChild(tb);
  }

  function renderDiag() {
    var d = document.getElementById('diag');
    d.innerHTML = '';
    if (!rows.length) return;
    d.appendChild(h('summary', null, 'Contrôle : comment les colonnes sont lues'));
    d.appendChild(h('p', null, 'Colonnes associées : Statut = ' + mapping.Statut + ' · Type = ' + mapping.Type +
      ' · première valeur de statut lue : ' + rows[0].rawKind));
    diagTable(d, 'Colonne Statut', 'raw', function (r) { return statutLabel(r.statut); });
    diagTable(d, 'Colonne Type de saisine', 'rawType', function (r) { return moduleLabel(r.type); });
  }

  function scrollToPanel() {
    var p = document.getElementById('panel');
    if (p.firstChild && p.scrollIntoView) p.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function highlight(parent, text) {
    if (!query) { parent.appendChild(document.createTextNode(text)); return; }
    var n = norm(text), q = norm(query), i = n.indexOf(q);
    if (i < 0 || n.length !== text.length) { parent.appendChild(document.createTextNode(text)); return; }
    parent.appendChild(document.createTextNode(text.slice(0, i)));
    parent.appendChild(h('mark', null, text.slice(i, i + q.length)));
    parent.appendChild(document.createTextNode(text.slice(i + q.length)));
  }

  function filtered() {
    var q = norm(query);
    var list = rows.filter(function (r) {
      if (view.type && r.type !== view.type) return false;
      if (view.statut && r.statut !== view.statut) return false;
      if (q) {
        var hay = norm([moduleLabel(r.type), 'dossier ' + r.id].concat(ALL.map(function (k) { return r.f[k]; })).join(' '));
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    if (sortMode === 'az') {
      list.sort(function (a, b) { return (fullName(a) || 'zzz' + a.id).localeCompare(fullName(b) || 'zzz' + b.id, 'fr'); });
    } else if (sortMode === 'num') {
      list.sort(function (a, b) { return (a.f.Numero || '').localeCompare(b.f.Numero || '', 'fr', { numeric:true }); });
    } else if (sortMode === 'statut') {
      var o = { a:0, t:1, c:2 };
      list.sort(function (a, b) { return o[a.statut] - o[b.statut] || b.id - a.id; });
    } else {
      list.sort(function (a, b) { return b.id - a.id; });
    }
    return list;
  }

  function renderPanel() {
    var host = document.getElementById('panel');
    host.innerHTML = '';
    if (!view.open) return;

    var scope = rows.filter(function (r) { return !view.type || r.type === view.type; });
    var title = view.type ? moduleLabel(view.type) : 'Toutes les demandes';

    var panel = h('section', 'panel');
    var head = h('div', 'panel-head');
    head.appendChild(h('h2', null, title));
    var tools = h('div', 'tools');
    var sel = h('select');
    sel.setAttribute('aria-label', 'Trier');
    [['recent','Plus récents d\'abord'],['az','Nom A → Z'],['num','N° de dossier'],['statut','Par statut']].forEach(function (o) {
      var op = h('option', null, o[1]); op.value = o[0]; if (sortMode === o[0]) op.selected = true; sel.appendChild(op);
    });
    sel.addEventListener('change', function () { sortMode = sel.value; renderPanel(); });
    tools.appendChild(sel);
    var close = h('button', 'btn', 'Fermer');
    close.addEventListener('click', function () {
      view = { type:null, statut:null, open:false };
      qInput.value = ''; query = ''; box.classList.remove('has');
      render();
    });
    tools.appendChild(close);
    head.appendChild(tools);
    panel.appendChild(head);

    var chips = h('div', 'chips');
    var all = h('button', 'chip' + (!view.statut ? ' active' : ''), 'Tous');
    all.appendChild(h('b', null, String(scope.length)));
    all.addEventListener('click', function () { view.statut = null; render(); });
    chips.appendChild(all);
    STATUTS.forEach(function (s) {
      var c = h('button', 'chip ' + s.key + (view.statut === s.key ? ' active' : ''), s.label);
      c.appendChild(h('b', null, String(count(scope, s.key))));
      c.addEventListener('click', function () { view.statut = s.key; render(); });
      chips.appendChild(c);
    });
    panel.appendChild(chips);

    var list = filtered();
    if (!list.length) {
      panel.appendChild(h('div', 'empty', query ? 'Aucun dossier ne correspond à « ' + query + ' ».' : 'Aucune demande dans cette sélection.'));
    }

    list.forEach(function (r) {
      var card = h('article', 'cand');

      var top = h('div', 'cand-top');
      var who = h('div');
      var name = h('div', 'who');
      highlight(name, candTitle(r));
      name.appendChild(h('span', 'tag ' + r.statut, statutLabel(r.statut)));
      who.appendChild(name);
      var sub = h('div', 'sub');
      if (r.f.Numero) { sub.appendChild(document.createTextNode('N° ')); highlight(sub, r.f.Numero); sub.appendChild(document.createTextNode(' · ')); }
      sub.appendChild(document.createTextNode(moduleLabel(r.type)));
      who.appendChild(sub);
      top.appendChild(who);

      var seg = h('div', 'seg');
      var btns = [];
      STATUTS.forEach(function (s) {
        var b = h('button', r.statut === s.key ? 'on ' + s.key : '', s.label);
        b.setAttribute('aria-pressed', r.statut === s.key ? 'true' : 'false');
        if (r.statut !== s.key) b.addEventListener('click', function () { setStatut(r.id, s.key, btns); });
        btns.push(b); seg.appendChild(b);
      });
      var actions = h('div', 'actions');
      actions.appendChild(seg);
      var ok = isJustif(r.id);
      var jb = h('button', 'justif' + (ok ? ' on' : ''));
      jb.setAttribute('role', 'checkbox');
      jb.setAttribute('aria-checked', ok ? 'true' : 'false');
      jb.appendChild(h('span', 'box', ok ? '✓' : ''));
      jb.appendChild(document.createTextNode('Justificatif'));
      jb.addEventListener('click', function () { setJustif(r.id, !ok, jb); });
      actions.appendChild(jb);
      top.appendChild(actions);
      card.appendChild(top);

      var grid = h('dl', 'fields');
      FIELDS.forEach(function (f) {
        if (!mapping[f.name]) return;     // colonne non associée : on ne l'affiche pas
        var box = h('div', 'fld' + (f.wide ? ' wide' : ''));
        box.appendChild(h('dt', null, (r.type === 'sport' && f.name === 'AvisMedecin') ? SHN_AVIS_TITLE : f.title));
        var dd = h('dd');
        if (r.f[f.name]) highlight(dd, r.f[f.name]); else { dd.textContent = '—'; dd.className = 'none'; }
        box.appendChild(dd);
        grid.appendChild(box);
      });
      if (grid.childNodes.length) card.appendChild(grid);

      NOTES.forEach(function (n) {
        var nkey = n.key + '_' + r.id;
        var useCol = n.key === 'avis' && !!mapping.AvisMedecin;
        var saved = useCol ? { t:r.avisMed, d:null } : (notes[nkey] || null);
        var savedText = saved ? (saved.t || '') : '';
        var shn = (r.type === 'sport' && n.key === 'avis');
        var nTitle = shn ? SHN_AVIS_TITLE : n.title;
        var nPlace = shn ? SHN_AVIS_PLACEHOLDER : (n.placeholder || '');
        var wrap = h('div', 'note');
        wrap.appendChild(h('div', 'note-label', nTitle));
        var ta = h('textarea', 'note-input');
        ta.setAttribute('aria-label', nTitle);
        ta.placeholder = nPlace;
        ta.value = drafts[nkey] != null ? drafts[nkey] : savedText;
        var foot = h('div', 'note-foot');
        var info = h('span', 'note-info', saved && saved.d ? 'Enregistré le ' + new Date(saved.d).toLocaleString('fr-FR', { dateStyle:'short', timeStyle:'short' }) : '');
        var sb = h('button', 'note-save', 'Enregistrer');
        sb.disabled = ta.value === savedText;
        ta.addEventListener('input', function () {
          drafts[nkey] = ta.value;
          sb.disabled = ta.value === savedText;
        });
        sb.addEventListener('click', function () { saveNote(nkey, ta.value, sb, info, r.id); });
        foot.appendChild(info); foot.appendChild(sb);
        wrap.appendChild(ta); wrap.appendChild(foot);
        card.appendChild(wrap);
      });

      panel.appendChild(card);
    });

    host.appendChild(panel);
  }

  render();   // la page s'affiche même avant l'arrivée des données
</script>
</body>
</html>
